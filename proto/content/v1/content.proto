  string description = 5 [json_name = "description"];
  string image_url = 6 [json_name = "image_url"];
  string mobile_image_url = 7 [json_name = "mobile_image_url"];
  string target_url = 8 [json_name = "target_url"];
  string button_text = 9 [json_name = "button_text"];
  string position = 10 [json_name = "position"];
  int32 sequence_order = 11 [json_name = "sequence_order"];
  string start_date = 12 [json_name = "start_date"];
  string end_date = 13 [json_name = "end_date"];
  bool is_active = 14 [json_name = "is_active"];
  string additional_data = 15 [json_name = "additional_data"];
  string created_at = 16 [json_name = "created_at"];
  string updated_at = 17 [json_name = "updated_at"];
  string image_key = 18 [json_name = "image_key"];
  string mobile_image_key = 19 [json_name = "mobile_image_key"];
}

