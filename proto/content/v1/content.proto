syntax = "proto3";

package content.v1;

option go_package = "content-service/internal/delivery/grpc/pb;pb";

service ContentService {
  // ---------------------------------------------------------------------------
  // 1. Banner Operations
  // ---------------------------------------------------------------------------
  rpc ListBanners (ListBannersRequest) returns (ListBannersResponse);
  rpc GetBanner (GetBannerRequest) returns (BannerResponse);
  rpc CreateBanner (CreateBannerRequest) returns (BannerResponse);
  rpc UpdateBanner (UpdateBannerRequest) returns (BannerResponse);
  rpc DeleteBanner (DeleteBannerRequest) returns (MessageResponse);

  // ---------------------------------------------------------------------------
  // 2. Blog Category & Article Operations
  // ---------------------------------------------------------------------------
  rpc ListBlogCategories (ListBlogCategoriesRequest) returns (ListBlogCategoriesResponse);
  rpc CreateBlogCategory (CreateBlogCategoryRequest) returns (BlogCategoryResponse);
  rpc UpdateBlogCategory (UpdateBlogCategoryRequest) returns (BlogCategoryResponse);

  rpc ListBlogs (ListBlogsRequest) returns (ListBlogsResponse);
  rpc GetBlog (GetBlogRequest) returns (BlogResponse);
  rpc CreateBlog (CreateBlogRequest) returns (BlogResponse);
  rpc UpdateBlog (UpdateBlogRequest) returns (BlogResponse);
  rpc DeleteBlog (DeleteBlogRequest) returns (MessageResponse);

  // ---------------------------------------------------------------------------
  // 3. Gallery Operations
  // ---------------------------------------------------------------------------
  rpc ListGalleries (ListGalleriesRequest) returns (ListGalleriesResponse);
  rpc GetGallery (GetGalleryRequest) returns (GalleryResponse);
  rpc CreateGallery (CreateGalleryRequest) returns (GalleryResponse);
  rpc UpdateGallery (UpdateGalleryRequest) returns (GalleryResponse);
  rpc DeleteGallery (DeleteGalleryRequest) returns (MessageResponse);
  rpc AddGalleryItem (AddGalleryItemRequest) returns (GalleryItemResponse);
  rpc DeleteGalleryItem (DeleteGalleryItemRequest) returns (MessageResponse);

  // ---------------------------------------------------------------------------
  // 4. Other Content Operations (Custom Blocks, FAQs, Testimonials)
  // ---------------------------------------------------------------------------
  rpc ListCustomBlocks (ListCustomBlocksRequest) returns (ListCustomBlocksResponse);
  rpc GetCustomBlock (GetCustomBlockRequest) returns (CustomBlockResponse);
  rpc UpsertCustomBlock (UpsertCustomBlockRequest) returns (CustomBlockResponse);
  rpc DeleteCustomBlock (DeleteCustomBlockRequest) returns (MessageResponse);

  rpc ListFAQs (ListFAQsRequest) returns (ListFAQsResponse);
  rpc CreateFAQ (CreateFAQRequest) returns (FAQResponse);
  rpc UpdateFAQ (UpdateFAQRequest) returns (FAQResponse);
  rpc DeleteFAQ (DeleteFAQRequest) returns (MessageResponse);

  rpc ListTestimonials (ListTestimonialsRequest) returns (ListTestimonialsResponse);
  rpc CreateTestimonial (CreateTestimonialRequest) returns (TestimonialResponse);
  rpc UpdateTestimonial (UpdateTestimonialRequest) returns (TestimonialResponse);
  rpc DeleteTestimonial (DeleteTestimonialRequest) returns (MessageResponse);

  // ---------------------------------------------------------------------------
  // 5. Media Upload
  // ---------------------------------------------------------------------------
  rpc UploadMedia (UploadMediaRequest) returns (UploadMediaResponse);
}

// =============================================================================
// Common Models
// =============================================================================

message PaginationMeta {
  int32 current_page = 1 [json_name = "current_page"];
  int32 per_page = 2 [json_name = "per_page"];
  int64 total_items = 3 [json_name = "total_items"];
  int32 total_pages = 4 [json_name = "total_pages"];
}

message MessageResponse {
  string message = 1 [json_name = "message"];
  string error = 2 [json_name = "error"];
}

// =============================================================================
// 1. Banner Models & Messages
// =============================================================================

